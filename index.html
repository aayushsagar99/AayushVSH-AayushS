<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <style>
        *{left: 30%;}
        img{position: absolute; top: 21%; height: 20%; }
    </style>
</head>
<body>
    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/GoogleLogoSept12015.png" alt="">
    <form action="https://google.com" method="get">
        <div style="position: absolute; top: 45%; border-radius: 20px; background-color: white; border: 1px solid #ccc; overflow: hidden; display: flex; width: 32.5%;">
            <input type="text" name="q" placeholder="Ask Google" style="border: none; padding: 10px;" required>
            <input type="submit" value="Search" style="border: none; background-color: aqua;" >
        </div>
    </form>
</body>
</html>
