<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/fav.ico">
    <title>Distance Calculator</title>
    <style>
        :root {
            /* Updated to modern gradient color schemes */
            --gradient-start: #6366f1;
            --gradient-end: #a855f7;
            --background-start: #eeecfb;
            --background-end: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --border: #e5e7eb;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            /* Smooth background gradient stretching diagonally */
            background: linear-gradient(135deg, var(--background-start) 0%, var(--background-end) 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .calculator-card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.1), 0 8px 15px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.75rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            text-align: center;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 60px 12px 16px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: #fafafa;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="number"]:focus {
            border-color: var(--gradient-start);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .unit {
            position: absolute;
            right: 16px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            pointer-events: none;
        }

        button {
            width: 100%;
            /* Gradient finish on the main calculation button */
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            margin-top: 1rem;
        }

        button:hover {
            opacity: 0.95;
        }

        button:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 12px;
            border-radius: 8px;
            background-color: #f5f3ff;
            border: 1px solid #ddd6fe;
            color: #5b21b6;
            font-weight: 600;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h1>Distance Calculator</h1>
        <div class="subtitle">Enter your details below</div>
        
        <div class="input-group">
            <label for="speed">Speed</label>
            <div class="input-wrapper">
                <input id="speed" type="number" min="0" placeholder="e.g., 60">
                <span class="unit">mph</span>
            </div>
        </div>

        <div class="input-group">
            <label for="duration">Time</label>
            <div class="input-wrapper">
                <input type="number" id="duration" min="0" step="any" placeholder="e.g., 1.5">
                <span class="unit">hours</span>
            </div>
        </div>
        
        <button id="calculateBtn" type="button">Calculate Distance</button>
        
        <div id="result" class="result-box"></div>
    </div>

    <script>
        document.getElementById("calculateBtn").addEventListener("click", function() {
            var speed = parseFloat(document.getElementById("speed").value);
            var timeInHours = parseFloat(document.getElementById("duration").value);
            var resultBox = document.getElementById("result");
            
            if (isNaN(speed) || isNaN(timeInHours)) {
                resultBox.style.display = "block";
                resultBox.style.backgroundColor = "#fef2f2";
                resultBox.style.borderColor = "#fca5a5";
                resultBox.style.color = "#991b1b";
                resultBox.textContent = "Please enter valid numbers.";
                return;
            }

            var distance = speed * timeInHours;
            
            resultBox.style.display = "block";
            resultBox.style.backgroundColor = "#f5f3ff";
            resultBox.style.borderColor = "#ddd6fe";
            resultBox.style.color = "#5b21b6";
            resultBox.textContent = "Distance: " + distance.toFixed(2) + " miles";
        });
    </script>
</body>
</html>
