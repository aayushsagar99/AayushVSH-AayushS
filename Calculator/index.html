<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanded Modern Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #a2d2bb;
            background-image: url('');
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            background-color: #f27b5d;
            padding: 24px;
            border-radius: 28px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
            width: 340px;
            transition: width 0.3s ease;
            overflow: hidden;
            border: 4px solid #d45f42;
        }

        .calculator.expanded {
            width: 500px;
        }

        .display-container {
            margin-bottom: 20px;
            background-color: #fffdf6;
            border-radius: 16px;
            border: 3px solid #d45f42;
            padding: 5px;
        }

        #display {
            width: 100%;
            height: 80px;
            background: transparent;
            border: none;
            outline: none;
            color: #594943;
            font-size: 2.5rem;
            text-align: right;
            padding: 10px;
            overflow: hidden;
            font-weight: bold;
        }

        .main-layout {
            display: flex;
            gap: 12px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            flex: 1;
        }

        .advanced-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 0;
            opacity: 0;
            pointer-events: none;
            transition: width 0.3s ease, opacity 0.2s ease;
        }

        .calculator.expanded .advanced-panel {
            width: 140px;
            opacity: 1;
            pointer-events: auto;
        }

        button {
            height: 65px;
            border-radius: 16px;
            border: 3px solid #d45f42;
            outline: none;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            background-color: #fffdf6;
            color: #594943;
            width: 100%;
            box-shadow: 0 4px 0 #d45f42;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        button.clear {
            background-color: #f7a08b;
            color: #fffdf6;
        }

        button.clear:hover {
            background-color: #f58a72;
        }

        button.delete {
            background-color: #a8cbd4;
            color: #fffdf6;
            border-color: #8bb3bc;
            box-shadow: 0 4px 0 #8bb3bc;
        }
        
        button.delete:active {
            box-shadow: none;
        }

        button.operator {
            background-color: #fffdf6;
            color: #f27b5d;
        }

        button.equal {
            background-color: #e8ce6b;
            color: #594943;
            grid-column: span 2;
            border-color: #cca93a;
            box-shadow: 0 4px 0 #cca93a;
        }
        
        button.equal:active {
            box-shadow: none;
        }

        button.toggle-btn {
            background-color: #e8ce6b;
            color: #594943;
            border-color: #cca93a;
            box-shadow: 0 4px 0 #cca93a;
        }
        
        button.toggle-btn:active {
            box-shadow: none;
        }

        button:hover:not(.clear):not(.delete):not(.equal):not(.toggle-btn) {
            background-color: #fffbf0;
        }
    </style>
</head>
<body>

    <div class="calculator" id="calc">
        <div class="display-container">
            <input type="text" id="display" placeholder="0">
        </div>
        
        <div class="main-layout">
            <div class="buttons">
                <button class="clear" onclick="clearDisplay()">C</button>
                <button class="delete" onclick="deleteLast()">DEL</button>
                <button class="operator" onclick="appendValue('%')">%</button>
                <button class="operator" onclick="appendValue('/')">/</button>

                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('*')">*</button>

                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('-')">-</button>

                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="operator" onclick="appendValue('+')">+</button>

                <button class="toggle-btn" onclick="toggleAdvanced()">ADV</button>
                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button class="equal" onclick="calculate()">=</button>
            </div>

            <div class="advanced-panel">
                <button class="operator" onclick="appendSpecial('sqrt')">√</button>
                <button class="operator" onclick="appendValue('**')">xʸ</button>
                <button class="operator" onclick="appendSpecial('sq')">x²</button>
                <button class="operator" onclick="appendValue('3.14159265')">π</button>
                <button class="operator" onclick="appendValue('(')">(</button>
                <button class="operator" onclick="appendValue(')')">)</button>
            </div>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const calc = document.getElementById('calc');

        function toggleAdvanced() {
            calc.classList.toggle('expanded');
        }

        function appendValue(input) {
            const start = display.selectionStart;
            const end = display.selectionEnd;
            const text = display.value;

            if (text === '0' && input === '0') return;

            let valueToInsert = input;
            let cursorOffset = input.length;

            if (input === '(') {
                valueToInsert = '()';
                cursorOffset = 1;
            }

            if (text === '0' && !['.', '*', '/', '+', '-', ')', '**'].includes(input)) {
                display.value = valueToInsert;
                display.setSelectionRange(cursorOffset, cursorOffset);
            } else {
                display.value = text.slice(0, start) + valueToInsert + text.slice(end);
                display.setSelectionRange(start + cursorOffset, start + cursorOffset);
            }
            display.focus();
        }

        function appendSpecial(type) {
            let currentValue = display.value;
            if (type === 'sqrt') {
                display.value = currentValue ? `Math.sqrt(${currentValue})` : 'Math.sqrt()';
                if (!currentValue) {
                    display.setSelectionRange(10, 10);
                }
            } else if (type === 'sq') {
                display.value = currentValue ? `(${currentValue})**2` : '()**2';
                if (!currentValue) {
                    display.setSelectionRange(1, 1);
                }
            }
            display.focus();
        }

        function clearDisplay() {
            display.value = '';
            display.focus();
        }

        function deleteLast() {
            const start = display.selectionStart;
            const end = display.selectionEnd;
            const text = display.value;

            if (start === end) {
                if (start > 0) {
                    display.value = text.slice(0, start - 1) + text.slice(start);
                    display.setSelectionRange(start - 1, start - 1);
                }
            } else {
                display.value = text.slice(0, start) + text.slice(end);
                display.setSelectionRange(start, start);
            }
            display.focus();
        }

        function calculate() {
            try {
                if (!display.value) return;

                let result = Function(`"use strict"; return (${display.value})`)();
                
                if (result % 1 !== 0) {
                    result = parseFloat(result.toFixed(8));
                }

                display.value = result;
            } catch (error) {
                display.value = 'Error';
            }
            display.focus();
        }

        document.addEventListener('keydown', function(event) {
            if (document.activeElement === display && !['Enter', 'Escape'].includes(event.key)) {
                if (event.key === '(') {
                    event.preventDefault();
                    appendValue('(');
                }
                return;
            }

            const key = event.key;
            
            if (/[0-9.]/.test(key)) {
                appendValue(key);
            } else if (['+', '-', '*', '/', '%', '(', ')'].includes(key)) {
                appendValue(key);
            } else if (key === '^') {
                appendValue('**');
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Backspace') {
                deleteLast();
            } 
            else if (key === 'Escape') {
                clearDisplay();
            } 
            else if (key.toLowerCase() === 'a') {
                toggleAdvanced();
            }
        }
    );
    </script>
</body>
</html>
