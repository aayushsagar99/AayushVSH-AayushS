<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="calculator">
        <input type="number" id="input" readonly>
        <div class="numbers">
            <button onclick="AppendOperation()" class="operation">+</button>
            <button onclick="AppendOperation()">9</button>
            <button onclick="AppendOperation()">8</button>
            <button onclick="AppendOperation()">7</button>
            <button onclick="AppendOperation()" class="operation">-</button>
            <button onclick="AppendOperation()">6</button>
            <button onclick="AppendOperation()">5</button>
            <button onclick="AppendOperation()">4</button>
            <button onclick="AppendOperation()" class="operation">×</button>
            <button onclick="AppendOperation()">3</button>
            <button onclick="AppendOperation()">2</button>
            <button onclick="AppendOperation()">1</button>
            <button onclick="AppendOperation()" class="operation">÷</button>
            <button onclick="AppendOperation()">.</button>
            <button onclick="AppendOperation()">0</button>
            <button onclick="Evaluate()" class="operation">=</button>
            <button onclick="Clear()">C</button>
        </div>
    </div>
</body>
<script src="./script.js"></script>
</html>
